{{- if index .Values "haproxy-ingress" "enabled" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-tcp-services
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustready.labels" . | nindent 4 }}
{{- if eq .Values.trustready.trustCenter.tlsMode "external" }}
data: {}
{{- else }}
data:
  # TCP passthrough for port 80 (HTTP)
  # Format: "<port>": "<namespace>/<service>:<port>"
  "80": "{{ .Release.Namespace }}/{{ include "trustready.fullname" . }}:{{ .Values.service.httpPort }}"

  # TCP passthrough for port 443 (HTTPS)
  "443": "{{ .Release.Namespace }}/{{ include "trustready.fullname" . }}:{{ .Values.service.httpsPort }}"
{{- end }}
{{- end }}
