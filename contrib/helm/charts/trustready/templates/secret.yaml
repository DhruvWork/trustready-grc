apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trustready.fullname" . }}
  labels:
    {{- include "trustready.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  db-password: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.postgresPassword | quote }}{{ else }}{{ required "postgresql.password is required when postgresql.enabled=false" .Values.postgresql.password | quote }}{{ end }}
  {{- if .Values.postgresql.caBundle }}
  pg-ca-bundle: {{ .Values.postgresql.caBundle | quote }}
  {{- end }}

  # S3 credentials
  s3-access-key: {{ include "trustready.s3.accessKeyId" . | quote }}
  s3-secret-key: {{ include "trustready.s3.secretAccessKey" . | quote }}

  # Application secrets
  encryption-key: {{ include "trustready.requireBase64Key32" (dict "name" "trustready.encryptionKey" "value" .Values.trustready.encryptionKey) | quote }}
  cookie-secret: {{ include "trustready.requireBase64Key32" (dict "name" "trustready.auth.cookieSecret" "value" .Values.trustready.auth.cookieSecret) | quote }}
  password-pepper: {{ include "trustready.requireBase64Key32" (dict "name" "trustready.auth.passwordPepper" "value" .Values.trustready.auth.passwordPepper) | quote }}
  oauth2-signing-key: {{ include "trustready.requirePEMPrivateKey" (dict "name" "trustready.oauth2.signingKey" "value" .Values.trustready.oauth2.signingKey) | quote }}
  {{- if .Values.trustready.identityFederation.enabled }}
  identity-federation-signing-key: {{ include "trustready.requirePEMPrivateKey" (dict "name" "trustready.identityFederation.signingKey" "value" .Values.trustready.identityFederation.signingKey) | quote }}
  {{- if .Values.trustready.identityFederation.previousSigningKey }}
  identity-federation-previous-signing-key: {{ include "trustready.requirePEMPrivateKey" (dict "name" "trustready.identityFederation.previousSigningKey" "value" .Values.trustready.identityFederation.previousSigningKey) | quote }}
  {{- end }}
  {{- end }}
  trust-token-secret: {{ include "trustready.requireBase64Key32" (dict "name" "trustready.trustAuth.tokenSecret" "value" .Values.trustready.trustAuth.tokenSecret) | quote }}
  {{- if and (ne .Values.trustready.trustCenter.tlsMode "external") .Values.trustready.customDomains.acme.accountKey }}
  acme-account-key: {{ include "trustready.requirePEMPrivateKey" (dict "name" "trustready.customDomains.acme.accountKey" "value" .Values.trustready.customDomains.acme.accountKey) | quote }}
  {{- end }}
  # Optional SMTP credentials
  {{- if .Values.trustready.mailer.smtp.user }}
  smtp-user: {{ .Values.trustready.mailer.smtp.user | quote }}
  {{- end }}
  {{- if .Values.trustready.mailer.smtp.password }}
  smtp-password: {{ .Values.trustready.mailer.smtp.password | quote }}
  {{- end }}

  # Optional OpenAI API key
  {{- if .Values.trustready.openai.apiKey }}
  openai-api-key: {{ .Values.trustready.openai.apiKey | quote }}
  {{- end }}

  # Optional Anthropic API key
  {{- if .Values.trustready.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.trustready.anthropic.apiKey | quote }}
  {{- end }}

  # Optional Firecrawl API key (agent tools)
  {{- if .Values.trustready.agentTools.firecrawlApiKey }}
  firecrawl-api-key: {{ .Values.trustready.agentTools.firecrawlApiKey | quote }}
  {{- end }}

  # Optional SAML secrets
  {{- if and .Values.trustready.saml.enabled .Values.trustready.saml.certificate }}
  saml-certificate: {{ .Values.trustready.saml.certificate | quote }}
  {{- end }}
  {{- if and .Values.trustready.saml.enabled .Values.trustready.saml.privateKey }}
  saml-private-key: {{ .Values.trustready.saml.privateKey | quote }}
  {{- end }}

  # Optional Connector secrets
  {{- range .Values.trustready.connectors }}
  {{- if eq .name "slack" }}
  {{- if .config.clientId }}
  connector-slack-client-id: {{ .config.clientId | quote }}
  {{- end }}
  {{- if .config.clientSecret }}
  connector-slack-client-secret: {{ .config.clientSecret | quote }}
  {{- end }}
  {{- if .config.signingSecret }}
  connector-slack-signing-secret: {{ .config.signingSecret | quote }}
  {{- end }}
  {{- if .config.endpointToken }}
  connector-slack-endpoint-token: {{ .config.endpointToken | quote }}
  {{- end }}
  {{- end }}
  {{- if and (eq .name "github") (eq .type "github-app") }}
  connector-github-app-private-key: {{ .config.privateKey | quote }}
  connector-github-app-client-secret: {{ .config.clientSecret | quote }}
  {{- end }}
  {{- if eq .name "linear" }}
  connector-linear-client-id: {{ required "trustready.connectors linear config.clientId is required when the linear connector is declared" .config.clientId | quote }}
  connector-linear-client-secret: {{ required "trustready.connectors linear config.clientSecret is required when the linear connector is declared" .config.clientSecret | quote }}
  {{- end }}
  {{- if eq .name "linear-sync" }}
  connector-linear-sync-client-id: {{ required "trustready.connectors linear-sync config.clientId is required when the linear-sync connector is declared" .config.clientId | quote }}
  connector-linear-sync-client-secret: {{ required "trustready.connectors linear-sync config.clientSecret is required when the linear-sync connector is declared" .config.clientSecret | quote }}
  connector-linear-sync-webhook-secret: {{ required "trustready.connectors linear-sync config.webhookSecret is required when the linear-sync connector is declared" .config.webhookSecret | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.trustready.slackbot.enabled }}
  slackbot-signing-secret: {{ required "trustready.slackbot.signingSecret is required when Slackbot is enabled" .Values.trustready.slackbot.signingSecret | quote }}
  slackbot-client-id: {{ required "trustready.slackbot.clientId is required when Slackbot is enabled" .Values.trustready.slackbot.clientId | quote }}
  slackbot-client-secret: {{ required "trustready.slackbot.clientSecret is required when Slackbot is enabled" .Values.trustready.slackbot.clientSecret | quote }}
  {{- end }}
