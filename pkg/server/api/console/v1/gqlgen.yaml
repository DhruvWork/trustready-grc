schema:
  - "graphql/*.graphql"

exec:
  filename: "schema/schema.go"
  package: "schema"

model:
  filename: "types/types.go"
  package: "types"

resolver:
  layout: "follow-schema"
  dir: "."
  package: "console_v1"
  filename_template: "{name}_resolvers.go"

autobind: []
call_argument_directives_with_null: true

directives:
  mustBeAuthorized:
    skip_runtime: false

models:
  ID:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/gqlutils/types/gid.GIDScalar"
  Datetime:
    model:
      - "github.com/99designs/gqlgen/graphql.Time"
  CursorKey:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/gqlutils/types/cursor.CursorKeyScalar"
  TimeSpan:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/gqlutils/types/timespan.TimeSpanScalar"
  BigInt:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/gqlutils/types/bigint.BigIntScalar"
  EmailAddr:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/gqlutils/types/mail.AddrScalar"
  TrustReadytIdentityBinding:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.TrustReadytIdentityBinding"
  TrustReadytIdentityBindPreview:
    model:
      - "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.TrustReadytIdentityBindPreview"
