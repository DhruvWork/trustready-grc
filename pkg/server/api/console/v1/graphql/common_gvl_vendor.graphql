enum CommonGVLVendorOrderField
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorOrderField"
    ) {
    NAME
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorOrderFieldName"
        )
    IAB_VENDOR_ID
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorOrderFieldIABVendorID"
        )
}

input CommonGVLVendorOrder
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.CommonGVLVendorOrderBy"
    ) {
    direction: OrderDirection!
    field: CommonGVLVendorOrderField!
}

enum CommonGVLVendorMembership
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorMembership"
    ) {
    ON_BANNER
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorMembershipOnBanner"
        )
    NOT_ON_BANNER
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.CommonGVLVendorMembershipNotOnBanner"
        )
}

input CommonGVLVendorFilter
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.CommonGVLVendorFilter"
    ) {
    query: String
    cookieBannerId: ID
    membership: CommonGVLVendorMembership
}

type CommonGVLCatalog {
    vendorListVersion: Int
    tcfPolicyVersion: Int
}

type CommonGVLVendor {
    id: ID!
    iabVendorId: Int!
    name: String!
    policyUrl: String
    purposes: [Int!]!
    legIntPurposes: [Int!]!
    specialFeatures: [Int!]!
}

type CommonGVLVendorConnection
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.CommonGVLVendorConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [CommonGVLVendorEdge!]!
    pageInfo: PageInfo!
}

type CommonGVLVendorEdge {
    cursor: CursorKey!
    node: CommonGVLVendor!
}
