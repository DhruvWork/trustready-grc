    oldValue: String
    newValue: String
    createdAt: Datetime!
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type TaskActivityConnection
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.TaskActivityConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [TaskActivityEdge!]!
    pageInfo: PageInfo!
}

type TaskActivityEdge {
    cursor: CursorKey!
    node: TaskActivity!
}
