enum AgentExecutionStatus
    @goModel(model: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatus") {
    IDLE
        @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatusIdle")
    RUNNING
        @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatusRunning")
    SUSPENDED
        @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatusSuspended")
    AWAITING_APPROVAL
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatusAwaitingApproval"
        )
    FAILED
        @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionStatusFailed")
}

enum AgentExecutionOrderField
    @goModel(model: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionOrderField") {
    CREATED_AT
        @goEnum(
            value: "github.com/DhruvWork/trustready-grc/pkg/coredata.AgentExecutionOrderFieldCreatedAt"
        )
}

input AgentExecutionOrder
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.AgentExecutionOrderBy"
    ) {
    direction: OrderDirection!
    field: AgentExecutionOrderField!
}

type AgentExecution implements Node {
    id: ID!
    organization: Organization! @goField(forceResolver: true)
    agentName: String!
    status: AgentExecutionStatus!
    errorMessage: String
    startedAt: Datetime
    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type AgentExecutionConnection
    @goModel(
        model: "github.com/DhruvWork/trustready-grc/pkg/server/api/console/v1/types.AgentExecutionConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [AgentExecutionEdge!]!
    pageInfo: PageInfo!
}

type AgentExecutionEdge {
    cursor: CursorKey!
    node: AgentExecution!
}

extend type Mutation {
    submitAgentExecutionApproval(
        input: SubmitAgentExecutionApprovalInput!
    ): SubmitAgentExecutionApprovalPayload!
}

input AgentExecutionApprovalDecisionInput {
    toolCallId: String!
    approved: Boolean!
    reason: String
}

input SubmitAgentExecutionApprovalInput {
    agentExecutionId: ID!
    decisions: [AgentExecutionApprovalDecisionInput!]!
}

type SubmitAgentExecutionApprovalPayload {
    agentExecution: AgentExecution!
}
