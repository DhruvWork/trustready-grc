directive @goField(
  forceResolver: Boolean
  name: String
  omittable: Boolean
) on INPUT_FIELD_DEFINITION | FIELD_DEFINITION

directive @goModel(
  model: String
  models: [String!]
) on OBJECT | INPUT_OBJECT | SCALAR | ENUM | INTERFACE | UNION

directive @goEnum(value: String) on ENUM_VALUE

scalar BigInt
scalar CursorKey
scalar Datetime
scalar EmailAddr

interface Node {
  id: ID!
}

type Query {
  viewer: Identity
  node(id: ID!): Node
  aliasedNode(alias: String!): Node
  currentCompliancePortal: CompliancePortal
  oidcProviders: [OIDCProviderInfo!]!
    @goField(forceResolver: true)
    @authentication(required: OPTIONAL)

  # The current viewer's own data subject requests for this compliance portal,
  # scoped by their verified email. Returns an empty connection for guests so
  # the portal can still render its empty state.
  myRightsRequests(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
  ): RightsRequestConnection! @goField(forceResolver: true)
}

type OIDCProviderInfo {
  name: String!
  loginURL: String!
}

type Mutation

type Identity implements Node {
  id: ID!
  email: EmailAddr!
  fullName: String!
  emailVerified: Boolean!
  # Preferred UI locale as a short URL tag (en, fr, de, …). Null until the
  # viewer explicitly chooses a language in the portal.
  locale: String
  createdAt: Datetime!
  updatedAt: Datetime!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: CursorKey
  endCursor: CursorKey
}

