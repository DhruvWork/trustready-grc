enum MembershipRole
  @goModel(model: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRole") {
  OWNER @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleOwner")
  ADMIN @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleAdmin")
  EMPLOYEE
    @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleEmployee")
  VIEWER @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleViewer")
  AUDITOR
    @goEnum(value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleAuditor")
  COMPLIANCE_PORTAL_MANAGER
    @goEnum(
      value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleCompliancePortalManager"
    )
  COMPLIANCE_PORTAL_ACCESS_MANAGER
    @goEnum(
      value: "github.com/DhruvWork/trustready-grc/pkg/coredata.MembershipRoleCompliancePortalAccessManager"
    )
}

type Membership implements Node {
  id: ID!
  createdAt: Datetime!
  role: MembershipRole!

  lastSession: Session @goField(forceResolver: true)

  permission(action: String!, attributes: Map): Boolean!
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
}

extend type Mutation {
  updateMembership(input: UpdateMembershipInput!): UpdateMembershipPayload!
}

input UpdateMembershipInput {
  organizationId: ID!
  membershipId: ID!
  role: MembershipRole!
}

type UpdateMembershipPayload {
  membership: Membership!
}
